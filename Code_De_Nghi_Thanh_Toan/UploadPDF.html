<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        max-width: 820px;
        margin: 0 auto;
        padding: 22px;
        color: #202124;
      }

      h3 {
        margin: 0 0 8px;
      }

      .info {
        color: #5f6368;
        font-size: 13px;
        margin-bottom: 18px;
      }

      .file-label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
      }

      input[type="file"] {
        display: block;
        width: 100%;
        margin-bottom: 16px;
      }

      #previewBox {
        display: none;
        border: 1px solid #dadce0;
        border-radius: 8px;
        padding: 14px;
        margin: 0 0 16px;
        background: #f8f9fa;
      }

      #previewName {
        font-weight: 600;
        overflow-wrap: anywhere;
        margin-bottom: 12px;
      }

      #imagePreview {
        display: none;
        width: 100%;
        max-height: 70vh;
        object-fit: contain;
        background: white;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
      }

      #pdfPreview {
        display: none;
      }

      .pdf-page {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 0 auto 14px;
        background: white;
        border: 1px solid #e0e0e0;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      }

      .pdf-page:last-child {
        margin-bottom: 0;
      }

      button {
        border: 0;
        border-radius: 4px;
        padding: 10px 18px;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #uploadButton {
        background: #1a73e8;
        color: white;
      }

      #cancelButton {
        background: #f1f3f4;
        margin-left: 8px;
      }

      #status {
        margin-top: 16px;
        font-size: 13px;
        line-height: 1.4;
      }

      .error {
        color: #d93025;
      }

      .success {
        color: #188038;
      }

      @media (max-width: 600px) {
        body {
          padding: 16px;
        }

        button {
          min-height: 44px;
        }
      }
    </style>
  </head>
  <body>
    <h3><?= tieuDe ?></h3>
    <div class="info">
      Dòng <?= row ?> — nhận PDF, JPG hoặc PNG, tối đa <?= maxSizeMb ?> MB.
    </div>

    <label class="file-label" for="uploadFile">
      Chọn tệp PDF, JPG hoặc PNG
    </label>
    <input
      id="uploadFile"
      type="file"
      accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png"
      onchange="handleFileSelected(this.files[0])"
    >

    <div id="previewBox">
      <div id="previewName"></div>
      <img id="imagePreview" alt="Bản xem trước ảnh">
      <div id="pdfPreview" aria-label="Bản xem trước PDF"></div>
    </div>

    <div>
      <button id="uploadButton" onclick="uploadFile()">Tải lên</button>
      <button id="cancelButton" onclick="cancelUpload()">Hủy</button>
    </div>

    <div id="status"></div>

    <!-- PDF.js vẽ PDF thành canvas, tránh lỗi iframe bị Chrome chặn. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      const loai = <?!= JSON.stringify(loai) ?>;
      const row = <?!= JSON.stringify(row) ?>;
      const token = <?!= JSON.stringify(token) ?>;
      const maxSizeMb = <?!= JSON.stringify(maxSizeMb) ?>;
      const webMode = <?!= JSON.stringify(webMode) ?>;
      const allowedMimeTypes = [
        'application/pdf',
        'image/jpeg',
        'image/png'
      ];

      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

      let selectedFile = null;
      let previewRequestId = 0;

      function setStatus(message, className) {
        const status = document.getElementById('status');
        status.textContent = message;
        status.className = className || '';
      }

      function setBusy(isBusy) {
        document.getElementById('uploadButton').disabled = isBusy;
        document.getElementById('cancelButton').disabled = isBusy;
        document.getElementById('uploadFile').disabled = isBusy;
      }

      function getExtension(fileName) {
        const lowerName = String(fileName || '').toLowerCase();
        if (lowerName.endsWith('.pdf')) return '.pdf';
        if (lowerName.endsWith('.jpeg')) return '.jpeg';
        if (lowerName.endsWith('.jpg')) return '.jpg';
        if (lowerName.endsWith('.png')) return '.png';
        return '';
      }

      function getMimeType(file) {
        const extension = getExtension(file && file.name);
        if (extension === '.pdf') return 'application/pdf';
        if (extension === '.jpg' || extension === '.jpeg') return 'image/jpeg';
        if (extension === '.png') return 'image/png';
        return String(file && file.type || '').toLowerCase();
      }

      function clearPreview() {
        const previewBox = document.getElementById('previewBox');
        const imagePreview = document.getElementById('imagePreview');
        const pdfPreview = document.getElementById('pdfPreview');

        previewBox.style.display = 'none';
        imagePreview.style.display = 'none';
        imagePreview.removeAttribute('src');
        pdfPreview.style.display = 'none';
        pdfPreview.replaceChildren();
      }

      async function handleFileSelected(file) {
        const requestId = ++previewRequestId;
        selectedFile = file || null;
        clearPreview();
        setStatus('', '');

        if (!selectedFile) return;

        if (!validateFile(selectedFile, false)) {
          selectedFile = null;
          document.getElementById('uploadFile').value = '';
          return;
        }

        const previewBox = document.getElementById('previewBox');
        document.getElementById('previewName').textContent =
          selectedFile.name + ' — ' + formatSize(selectedFile.size);
        previewBox.style.display = 'block';

        try {
          if (getMimeType(selectedFile) === 'application/pdf') {
            setStatus('Đang tạo bản xem trước PDF...', '');
            await renderPdfPreview(selectedFile, requestId);
          } else {
            await renderImagePreview(selectedFile, requestId);
          }

          if (requestId === previewRequestId) {
            setStatus(
              'Hãy kiểm tra bản xem trước rồi bấm Tải lên nếu tệp đã đúng.',
              ''
            );
          }
        } catch (error) {
          if (requestId !== previewRequestId) return;
          selectedFile = null;
          clearPreview();
          document.getElementById('uploadFile').value = '';
          setStatus(
            'Không thể tạo bản xem trước. Tệp có thể bị lỗi hoặc không đúng định dạng.',
            'error'
          );
        }
      }

      function renderImagePreview(file, requestId) {
        return new Promise(function(resolve, reject) {
          const reader = new FileReader();
          reader.onload = function(event) {
            if (requestId !== previewRequestId) return resolve();

            const imagePreview = document.getElementById('imagePreview');
            imagePreview.onload = resolve;
            imagePreview.onerror = reject;
            imagePreview.src = String(event.target.result || '');
            imagePreview.style.display = 'block';
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      async function renderPdfPreview(file, requestId) {
        const data = new Uint8Array(await file.arrayBuffer());
        const pdf = await pdfjsLib.getDocument({ data: data }).promise;
        const container = document.getElementById('pdfPreview');

        container.style.display = 'block';

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
          if (requestId !== previewRequestId) return;

          setStatus(
            'Đang tạo bản xem trước PDF: trang ' +
              pageNumber + '/' + pdf.numPages + '...',
            ''
          );

          const page = await pdf.getPage(pageNumber);
          const unscaledViewport = page.getViewport({ scale: 1 });
          const availableWidth = Math.min(
            document.getElementById('previewBox').clientWidth - 30,
            1100
          );
          const scale = Math.max(
            0.6,
            Math.min(1.7, availableWidth / unscaledViewport.width)
          );
          const viewport = page.getViewport({ scale: scale });
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');

          canvas.className = 'pdf-page';
          canvas.width = Math.ceil(viewport.width);
          canvas.height = Math.ceil(viewport.height);
          container.appendChild(canvas);

          await page.render({
            canvasContext: context,
            viewport: viewport
          }).promise;
        }
      }

      function formatSize(bytes) {
        if (bytes < 1024 * 1024) {
          return (bytes / 1024).toFixed(1) + ' KB';
        }
        return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      }

      function validateFile(file, showMissingMessage) {
        if (!file) {
          if (showMissingMessage) {
            setStatus('Hãy chọn tệp PDF, JPG hoặc PNG.', 'error');
          }
          return false;
        }

        const mimeType = getMimeType(file);
        const extension = getExtension(file.name);

        if (!allowedMimeTypes.includes(mimeType) || !extension) {
          setStatus('Chỉ được tải lên tệp PDF, JPG hoặc PNG.', 'error');
          return false;
        }

        if (file.size > maxSizeMb * 1024 * 1024) {
          setStatus('Tệp vượt quá ' + maxSizeMb + ' MB.', 'error');
          return false;
        }

        return true;
      }

      function cancelUpload() {
        previewRequestId++;
        clearPreview();

        if (webMode) {
          window.close();
          if (!window.closed) history.back();
        } else {
          google.script.host.close();
        }
      }

      function uploadFile() {
        const file = selectedFile;

        if (!validateFile(file, true)) return;

        setBusy(true);
        setStatus('Đang tải tệp lên Google Drive...', '');

        const reader = new FileReader();

        reader.onload = function(event) {
          const dataUrl = String(event.target.result || '');
          const base64 = dataUrl.split(',')[1];

          google.script.run
            .withSuccessHandler(function(result) {
              const suffix = result.lanTai
                ? ' (lần ' + result.lanTai + ')'
                : '';

              setStatus(
                'Đã tải thành công' + suffix + ': ' + result.fileName +
                  (result.viewOnly ? '. Link chỉ có quyền xem.' : '') +
                  (webMode ? ' Bạn có thể đóng tab này.' : ''),
                'success'
              );

              if (!webMode) {
                setTimeout(function() {
                  google.script.host.close();
                }, 1200);
              }
            })
            .withFailureHandler(function(error) {
              setBusy(false);
              setStatus(error.message || String(error), 'error');
            })
            .luuPdfTuMayTinh({
              loai: loai,
              row: row,
              token: token,
              fileName: file.name,
              mimeType: getMimeType(file),
              base64: base64
            });
        };

        reader.onerror = function() {
          setBusy(false);
          setStatus('Không thể đọc tệp trên thiết bị.', 'error');
        };

        reader.readAsDataURL(file);
      }
    </script>
  </body>
</html>
